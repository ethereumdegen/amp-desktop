[package]
name = "native-spice"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
native-agent = { path = "../native-agent" }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
spice-framework = { version = "=0.2.0", default-features = false }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[[bin]]
name = "native-spice"
path = "src/main.rs"
