[workspace]
members = ["crates/omp-control", "crates/native-agent", "crates/desktop-core", "crates/native-spice", "src-tauri"]
default-members = ["crates/omp-control", "crates/native-agent", "crates/desktop-core"]
exclude = ["vendor/pi-diff"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[profile.dev]
debug = 0
incremental = false
codegen-units = 1

[profile.dev.package."*"]
opt-level = 1
codegen-units = 1

[profile.dev.build-override]
opt-level = 0
codegen-units = 1

[profile.dev.package.omp-desktop]
strip = "none"

[profile.test]
debug = 0
incremental = false

[profile.release]
lto = "thin"
strip = true
